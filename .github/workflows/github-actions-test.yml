name: GitHub Actions test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Check formatting with pinned clang-format
      run: ./scripts/run-pinned-toolchain.sh format --check

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Install test dependencies
      run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
    - name: Run tests
      run: ./scripts/test.sh
